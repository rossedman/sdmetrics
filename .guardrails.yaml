# yaml-language-server: $schema=https://raw.githubusercontent.com/rossedman/guardrails/main/internal/config/schema.json
#
# Presets: strict (90% coverage, 90% of changed lines), standard (80%/80%),
# adopt (coverage may not drop, 80% of changed lines). Any key set here
# overrides the preset. Docs: https://rossedman.github.io/guardrails/configuration/
version: 1
preset: strict
go:
  coverage:
    # Examples are documentation, run by hand and in the integration tests;
    # hack/coverage.sh excludes them too. Lists replace the defaults.
    exclude: ["**/mocks/**", "**/*_mock.go", "**/*.pb.go", "cmd/**/main.go", "examples/**"]
