version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
  - package-ecosystem: gomod
    directory: /receiver/systemdreportreceiver
    schedule:
      interval: weekly
    groups:
      collector:
        patterns: ["go.opentelemetry.io/*", "github.com/open-telemetry/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
