name: Fuzz

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        default: 10m

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: FuzzDecodeValue, pkg: ./scrape/ }
          - { name: FuzzDecodeFields, pkg: ./scrape/ }
          - { name: FuzzSanitizeField, pkg: ./internal/names/ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime ${{ inputs.fuzztime || '10m' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: crashers-${{ matrix.target.name }}
          path: "**/testdata/fuzz/"
