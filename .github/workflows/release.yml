name: Release

# Every branch push builds a GoReleaser snapshot and attaches the archives
# and packages to the workflow run. Every v* tag publishes a GitHub
# release. The receiver module is tagged separately, as
# receiver/systemdreportreceiver/vX.Y.Z; Go modules need nothing more.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  snapshot:
    name: Snapshot (${{ github.ref_name }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser derives versions from tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # release builds never restore a cache
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
      - name: Name the artifact after the branch
        id: name
        run: echo "slug=$(echo '${{ github.ref_name }}' | tr '/_' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdmetrics-snapshot-${{ steps.name.outputs.slug }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### Snapshot \`$(jq -r .version dist/metadata.json)\`"
            echo
            echo '| Asset | SHA-256 |'
            echo '| --- | --- |'
            awk '{print "| `" $2 "` | `" substr($1,1,16) "…` |"}' dist/checksums.txt
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the release
      id-token: write # keyless cosign signing and provenance
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # a restored cache could be poisoned by any earlier run
      - name: Test before releasing
        run: |
          go test -race ./...
          (cd receiver/systemdreportreceiver && go test -race ./...)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
