name: Release

# Every branch push builds a GoReleaser snapshot and attaches the archives
# and packages to the workflow run. Every v* tag publishes a GitHub
# release. The receiver module is tagged separately, as
# receiver/systemdreportreceiver/vX.Y.Z; Go modules need nothing more.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  snapshot:
    name: Snapshot (${{ github.ref_name }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser derives versions from tags
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Name the artifact after the branch
        id: name
        run: echo "slug=$(echo '${{ github.ref_name }}' | tr '/_' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: sdmetrics-snapshot-${{ steps.name.outputs.slug }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### Snapshot \`$(jq -r .version dist/metadata.json)\`"
            echo
            echo '| Asset | SHA-256 |'
            echo '| --- | --- |'
            awk '{print "| `" $2 "` | `" substr($1,1,16) "…` |"}' dist/checksums.txt
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test before releasing
        run: |
          go test -race ./...
          (cd receiver/systemdreportreceiver && go test -race ./...)
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
